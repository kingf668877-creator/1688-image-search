<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>AI 智能图搜 · 批量找货源</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-content">
      <h1>AI 智能图搜 · 批量找货源</h1>
      <p>上传图片，一键找遍1688货源</p>
      <p class="hero-subtitle">支持批量上传图片，自动调用1688图搜接口，快速定位同款商品源头供应商，附带相似度评分，帮你找到性价比最高的货源。</p>
      <p class="backend-tip">首次使用请先 <a href="https://yidong.dianleida.net:22000/api/tasks" target="_blank" rel="noopener">点此打开后端</a>，然后上传图片开始图搜</p>
    </div>
    <div class="stats">
      <div><strong>1000万+</strong><span>商品数据库</span></div>
      <div><strong>98%</strong><span>识别准确率</span></div>
      <div><strong>批量</strong><span>多图同时搜索</span></div>
    </div>
  </header>

  <main class="container">
    <section class="upload-section card">
      <h2>批量上传图片</h2>
      <p class="section-desc">支持 JPG、PNG、WebP 等格式，不限数量与大小</p>
      <div class="upload-tabs" id="uploadTabs">
        <button class="upload-tab active" data-tab="batch">🖼️图片批量上传</button>
        <button class="upload-tab" data-tab="link">🔗图片链接批量上传</button>
        <button class="upload-tab" data-tab="table">📋图片表格批量上传</button>
      </div>

      <div class="upload-panel active" id="panel-batch">
        <label class="drop-zone" id="dropZone">
          <span class="drop-icon">📁</span>
          <strong>拖拽图片到此处，或 点击选择文件</strong>
          <span>支持批量选择多张图片同时上传，不限数量</span>
          <input type="file" id="fileInput" accept="image/*" multiple hidden />
        </label>
        <div class="preview-grid" id="previewGrid"></div>
        <div class="upload-actions">
          <button class="btn btn-danger-ghost" id="clearBtn" type="button">清空图片</button>
        </div>
      </div>

      <div class="upload-panel" id="panel-link">
        <textarea id="urlTextarea" class="url-textarea" placeholder="每行输入一个图片链接，例如：https://example.com/image.jpg"></textarea>
        <div class="url-actions">
          <button class="btn btn-primary" id="previewUrlBtn" type="button">预览链接图片</button>
          <button class="btn btn-danger-ghost" id="clearUrlBtn" type="button">清空链接</button>
        </div>
        <div class="preview-grid" id="urlPreviewGrid"></div>
      </div>

      <div class="upload-panel" id="panel-table">
        <div class="table-upload-wrap">
          <p class="panel-hint">上传 Excel（.xlsx/.xls）或 CSV 文件，自动识别表格中的图片链接。</p>
          <label class="spreadsheet-zone">
            <strong>拖拽表格文件到此处，或点击选择文件</strong>
            <span>支持 .xlsx、.xls、.csv 格式</span>
            <input type="file" accept=".xlsx,.xls,.csv" multiple hidden />
          </label>
          <div class="table-actions">
            <button class="btn btn-danger-ghost" id="clearTableBtn" type="button">清空表格文件</button>
          </div>
        </div>
      </div>

      <div class="search-actions">
        <button class="btn btn-primary btn-large" id="searchBtn" type="button">开始批量搜索</button>
      </div>
    </section>

    <section class="progress-section card" id="progress-section" hidden>
      <div class="card-header">
        <h2>搜索进度</h2>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <p id="progressText">准备中...</p>
      <p id="elapsedText"></p>
    </section>

    <section class="results-section card" id="results-section" hidden>
      <div class="card-header">
        <h2>搜索结果</h2>
        <button class="btn btn-secondary" id="exportBtn" type="button">导出结果</button>
      </div>
      <div id="resultsContainer"></div>
    </section>
  </main>

  <footer>AI 智能图搜 · 高效找货源</footer>
  <script src="js/app.js?v=20260813k"></script>
  <script src="js/enhancements.js?v=20260813l"></script>
</body>
</html>
