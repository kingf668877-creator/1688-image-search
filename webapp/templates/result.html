<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>搜索结果 - 1688 图搜批量寻源</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<!-- 背景装饰 -->
<div class="bg-decoration">
  <div class="bg-circle bg-circle-1"></div>
  <div class="bg-circle bg-circle-2"></div>
  <div class="bg-grid"></div>
</div>

<!-- 顶部导航 -->
<header class="header">
  <div class="container header-inner">
    <div class="logo">
      <span class="logo-icon">🛒</span>
      <span class="logo-text">1688<span class="logo-accent">图搜</span></span>
    </div>
    <nav class="nav">
      <a href="/" class="nav-link">返回首页</a>
      <button class="nav-link settings-btn" id="settingsBtn" title="后端设置">⚙️</button>
    </nav>
  </div>
</header>

<!-- 主内容区 -->
<main class="main">
  <div class="container">

    <!-- 加载状态 -->
    <section class="loading-section" id="loadingSection">
      <div class="card" style="padding: 60px; text-align: center;">
        <div style="font-size: 48px; margin-bottom: 16px;">⏳</div>
        <div style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">正在加载搜索结果...</div>
        <div style="color: var(--text-muted); font-size: 13px;">任务ID: <span id="taskIdDisplay">{{ task_id }}</span></div>
      </div>
    </section>

    <!-- 结果区域 -->
    <section class="result-section" id="resultSection" style="display: none;">
      <div class="result-header">
        <div class="result-title-wrap">
          <h2 class="result-title">
            <span class="title-icon">📊</span>
            搜索结果
          </h2>
          <div class="result-subtitle" id="resultSubtitle">搜索完成</div>
        </div>
        <div class="result-actions">
          <button class="btn btn-ghost" id="exportJsonBtn">
            <span>导出 JSON</span>
          </button>
          <button class="btn btn-danger-ghost" id="stopTaskBtn" title="停止当前任务并清理状态" style="display: none;">
            <span class="btn-icon">🛑</span>
            <span>停止任务</span>
          </button>
          <a href="/" class="btn btn-outline">
            <span>新建搜索</span>
          </a>
        </div>
      </div>

      <!-- 统计卡片 -->
      <div class="stats-row" id="statsRow"></div>

      <!-- 图片结果列表 -->
      <div class="result-list" id="resultList"></div>
    </section>

    <!-- 错误状态 -->
    <section class="error-section" id="errorSection" style="display: none;">
      <div class="card" style="padding: 60px; text-align: center;">
        <div style="font-size: 48px; margin-bottom: 16px;">❌</div>
        <div style="font-size: 18px; font-weight: 600; margin-bottom: 8px;">加载失败</div>
        <div style="color: var(--text-muted); font-size: 13px;" id="errorMessage">无法获取搜索结果</div>
        <div style="margin-top: 24px;">
          <a href="/" class="btn btn-primary">
            <span>返回首页</span>
          </a>
        </div>
      </div>
    </section>

  </div>
</main>

<!-- 底部 -->
<footer class="footer">
  <div class="container">
    <div class="footer-content">
      <div class="footer-brand">
        <div class="logo">
          <span class="logo-icon">🛒</span>
          <span class="logo-text">1688<span class="logo-accent">图搜</span></span>
        </div>
        <p class="footer-desc">批量图搜找货源，助力电商选品</p>
      </div>
      <div class="footer-bottom">
        <p>数据来源：1688.com · 仅供参考</p>
      </div>
    </div>
  </div>
</footer>

<!-- 设置弹窗 -->
<div class="settings-modal" id="settingsModal" style="display: none;">
  <div class="settings-overlay" id="settingsOverlay"></div>
  <div class="settings-panel">
    <div class="settings-header">
      <h3>后端设置</h3>
      <button class="settings-close" id="settingsClose">×</button>
    </div>
    <div class="settings-body">
      <div class="form-group">
        <label>后端 API 地址</label>
        <input type="text" id="apiBaseInput" placeholder="http://localhost:5000">
        <p class="form-hint">
          本地运行请填 <code>http://localhost:5000</code><br>
          同域部署留空即可
        </p>
      </div>
      <div class="form-group">
        <label>连接状态</label>
        <div class="connection-status" id="connectionStatus">
          <span class="status-dot"></span>
          <span class="status-text">未检测</span>
        </div>
      </div>
    </div>
    <div class="settings-footer">
      <button class="btn btn-ghost" id="settingsCancel">取消</button>
      <button class="btn btn-primary" id="settingsSave">
        <span>保存设置</span>
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const taskId = '{{ task_id }}';
  const DEFAULT_API_BASE = '';

  const getApiBase = () => {
    return localStorage.getItem('apiBase') || DEFAULT_API_BASE;
  };
  const setApiBase = (url) => {
    if (url) {
      localStorage.setItem('apiBase', url.replace(/\/$/, ''));
    } else {
      localStorage.removeItem('apiBase');
    }
  };
  const api = (path) => getApiBase() + path;

  let results = null;

  // ====== 初始化 ======
  function init() {
    setupSettings();
    setupStopButton();
    loadResults();
  }

  // ====== 停止任务按钮 ======
  function setupStopButton() {
    const btn = document.getElementById('stopTaskBtn');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      const ok = window.confirm('确定要停止当前搜索任务吗？');
      if (!ok) return;
      btn.disabled = true;
      btn.innerHTML = '<span class="btn-icon">⏳</span><span>停止中...</span>';
      try {
        await fetch(api(`/api/tasks/${taskId}`), { method: 'DELETE' });
        await fetch(api(`/api/tasks/${taskId}/cleanup`), { method: 'POST' });
        alert('已停止并清理任务，可以返回首页新建搜索。');
        btn.style.display = 'none';
      } catch (err) {
        alert('停止失败: ' + err.message);
        btn.disabled = false;
        btn.innerHTML = '<span class="btn-icon">🛑</span><span>停止任务</span>';
      }
    });
  }

  // ====== 设置面板 ======
  function setupSettings() {
    const settingsBtn = document.getElementById('settingsBtn');
    const settingsModal = document.getElementById('settingsModal');
    const settingsOverlay = document.getElementById('settingsOverlay');
    const settingsClose = document.getElementById('settingsClose');
    const settingsCancel = document.getElementById('settingsCancel');
    const settingsSave = document.getElementById('settingsSave');
    const apiBaseInput = document.getElementById('apiBaseInput');
    const connectionStatus = document.getElementById('connectionStatus');

    if (!settingsBtn) return;

    settingsBtn.addEventListener('click', openSettings);
    settingsOverlay.addEventListener('click', closeSettings);
    settingsClose.addEventListener('click', closeSettings);
    settingsCancel.addEventListener('click', closeSettings);
    settingsSave.addEventListener('click', saveSettings);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && settingsModal.style.display !== 'none') {
        closeSettings();
      }
    });

    function openSettings() {
      apiBaseInput.value = getApiBase();
      settingsModal.style.display = 'flex';
      checkConnection();
    }

    function closeSettings() {
      settingsModal.style.display = 'none';
    }

    function saveSettings() {
      const url = apiBaseInput.value.trim();
      setApiBase(url);
      closeSettings();
      const btn = settingsSave;
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span>✓ 已保存</span>';
      setTimeout(() => {
        btn.innerHTML = originalText;
      }, 1500);
      // 重新加载结果
      document.getElementById('loadingSection').style.display = 'block';
      document.getElementById('resultSection').style.display = 'none';
      document.getElementById('errorSection').style.display = 'none';
      loadResults();
    }

    async function checkConnection() {
      const statusDot = connectionStatus.querySelector('.status-dot');
      const statusText = connectionStatus.querySelector('.status-text');

      statusDot.className = 'status-dot checking';
      statusText.textContent = '检测中...';

      const baseUrl = apiBaseInput.value.trim();
      if (!baseUrl) {
        statusDot.className = 'status-dot';
        statusText.textContent = '使用当前域名';
        return;
      }

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 5000);

        const res = await fetch(baseUrl + '/api/tasks', {
          method: 'GET',
          signal: controller.signal,
        });

        clearTimeout(timeoutId);

        if (res.ok) {
          statusDot.className = 'status-dot connected';
          statusText.textContent = '连接成功';
        } else {
          statusDot.className = 'status-dot disconnected';
          statusText.textContent = '连接失败';
        }
      } catch (error) {
        statusDot.className = 'status-dot disconnected';
        statusText.textContent = '无法连接';
      }
    }
  }

  // ====== 加载结果 ======
  async function loadResults() {
    try {
      const res = await fetch(api(`/api/results/${taskId}`));
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || '获取结果失败');
      }

      if (data.status === 'failed') {
        showError(data.message || '搜索失败');
        return;
      }

      results = data;
      renderResults(data);

    } catch (error) {
      console.error('加载结果失败:', error);
      showError(error.message);
    }
  }

  // ====== 显示错误 ======
  function showError(message) {
    document.getElementById('loadingSection').style.display = 'none';
    document.getElementById('resultSection').style.display = 'none';
    document.getElementById('errorSection').style.display = 'block';
    document.getElementById('errorMessage').textContent = message || '无法获取搜索结果';
  }

  // ====== 渲染结果 ======
  function renderResults(data) {
    document.getElementById('loadingSection').style.display = 'none';
    document.getElementById('errorSection').style.display = 'none';
    document.getElementById('resultSection').style.display = 'block';

    const stopBtn = document.getElementById('stopTaskBtn');
    if (stopBtn) {
      if (data.status === 'completed' || data.status === 'failed') {
        stopBtn.style.display = 'none';
      } else {
        stopBtn.style.display = 'inline-flex';
      }
    }

    const totalImages = data.total_images || 0;
    const totalProducts = data.total_products || 0;

    document.getElementById('resultSubtitle').textContent =
      `共搜索 ${totalImages} 张图片，找到 ${totalProducts} 个商品`;

    // 统计卡片
    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card">
        <div class="stat-num">${totalImages}</div>
        <div class="stat-label">搜索图片数</div>
      </div>
      <div class="stat-card secondary">
        <div class="stat-num">${totalProducts}</div>
        <div class="stat-label">找到商品数</div>
      </div>
      <div class="stat-card">
        <div class="stat-num">${totalImages > 0 ? Math.round(totalProducts / totalImages) : 0}</div>
        <div class="stat-label">平均结果/图</div>
      </div>
    `;

    // 渲染每个图片的结果
    const resultList = document.getElementById('resultList');
    resultList.innerHTML = '';

    const resultsData = data.results || {};
    const imageNames = Object.keys(resultsData);

    imageNames.forEach((imageName, idx) => {
      const imageData = resultsData[imageName];
      const section = createImageSection(imageName, imageData, idx);
      resultList.appendChild(section);
    });

    // 绑定导出按钮
    document.getElementById('exportJsonBtn').addEventListener('click', exportJson);
  }

  // ====== 创建图片结果区块 ======
  function createImageSection(imageName, imageData, index) {
    const section = document.createElement('div');
    section.className = 'image-section';

    const count = imageData.result_count || 0;
    const countClass = count === 0 ? 'result-count zero' : 'result-count';
    const countText = count === 0 ? '未找到结果' : `${count} 个结果`;

    // 获取图片预览URL
    let imageUrl = '';
    if (taskId && imageData.image_name) {
      imageUrl = api(`/uploads/${taskId}/${imageData.image_name}`);
    }

    section.innerHTML = `
      <div class="image-header">
        <img class="image-thumb" src="${imageUrl}" alt="${imageName}" onerror="this.style.display='none'">
        <div class="image-info">
          <h3>${imageName}</h3>
          <div class="meta">搜索时间：${formatTime(imageData.search_time)} · 相似度值越小越相似</div>
        </div>
        <div class="${countClass}">${countText}</div>
      </div>
      <div class="product-grid" id="grid-${index}"></div>
    `;

    const grid = section.querySelector('.product-grid');
    const items = imageData.results || [];

    if (items.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column: 1/-1;">
          <div class="empty-icon">🔍</div>
          <p>未找到匹配的商品</p>
        </div>
      `;
    } else {
      // 按相似度排序（值越小越相似）
      const sortedItems = [...items].sort((a, b) => {
        const sa = a.similarity !== undefined && a.similarity !== null ? a.similarity : 999;
        const sb = b.similarity !== undefined && b.similarity !== null ? b.similarity : 999;
        return sa - sb;
      });

      sortedItems.forEach(item => {
        const card = createProductCard(item);
        grid.appendChild(card);
      });
    }

    return section;
  }

  // ====== 创建商品卡片 ======
  function createProductCard(item) {
    const card = document.createElement('div');
    card.className = 'product-card';

    // 相似度展示
    let simBadge = '';
    let simBar = '';
    let simText = '';

    if (item.similarity !== undefined && item.similarity !== null) {
      const sim = item.similarity;
      const displaySim = sim.toFixed(2);  // 保留2位小数

      // 徽章颜色：橙色背景
      const badgeColor = '#ff6a00';

      simBadge = `<div class="similarity-badge" style="background: ${badgeColor}">${displaySim}</div>`;
      simBar = '';  // 去掉底部进度条
      simText = '';  // 价格旁边不展示相似度
    }

    // 商品图片
    const imgHtml = item.image
      ? `<img src="${item.image}" alt="${item.title || ''}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'padding:20px;text-align:center;color:#999;\\'>加载失败</div>'">`
      : '<div style="padding:20px;text-align:center;color:#999;">无图</div>';

    card.innerHTML = `
      <div class="product-img">
        ${simBadge}
        ${imgHtml}
        ${simBar}
      </div>
      <div class="product-body">
        <div class="product-title">${item.title || '暂无标题'}</div>
        <div class="product-price">
          <span class="price-text">${item.price || '面议'}</span>
          ${simText}
        </div>
        <div class="product-shop">${item.shop || ''}</div>
      </div>
    `;

    // 点击跳转到商品详情
    if (item.url) {
      card.addEventListener('click', () => {
        window.open(item.url, '_blank');
      });
    }

    return card;
  }

  // ====== 导出JSON ======
  function exportJson() {
    if (!results) return;

    const dataStr = JSON.stringify(results, null, 2);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);

    const a = document.createElement('a');
    a.href = url;
    a.download = `1688图搜结果_${taskId}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ====== 工具函数 ======
  function formatTime(isoString) {
    if (!isoString) return '-';
    try {
      const date = new Date(isoString);
      return date.toLocaleString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
      });
    } catch {
      return isoString;
    }
  }

  // ====== 启动 ======
  document.addEventListener('DOMContentLoaded', init);

})();
</script>
</body>
</html>
